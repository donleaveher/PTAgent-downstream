<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP 控制台 — 工具与参数</title>
  <link rel="stylesheet" href="/ui-static/shell.css" />
  <link rel="stylesheet" href="/mcp-admin/static/mcp-admin.css" />
</head>
<body data-page="tools">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">控制台</div>
      <div class="section">PTAgent</div>
      <a href="/ptagent-admin/">总览</a>
      <a href="/ptagent-admin/agents">Agents</a>
      <a href="/ptagent-admin/flow">编排</a>
      <a href="/ptagent-admin/llm">LLM</a>
      <div class="section">MCP Broker</div>
      <a href="/mcp-admin/">概览</a>
      <a class="active" href="/mcp-admin/tools">工具与参数</a>
      <a href="/mcp-admin/fields">字段约定</a>
      <a href="/mcp-admin/debug">调试</a>
    </aside>
    <main class="main">
      <h1>工具与参数</h1>
      <p class="lead">工具目录与 <code>tools/call</code> 测试</p>

      <section>
        <h2>工具列表</h2>
        <div class="toolbar">
          <button type="button" class="primary" id="btnLoadTools">拉取工具</button>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>名称</th>
                <th>说明</th>
                <th>输入 Schema</th>
              </tr>
            </thead>
            <tbody id="toolRows"></tbody>
          </table>
        </div>
        <p class="err-msg" id="toolsErr" hidden></p>
      </section>

      <section>
        <h2>调用工具</h2>
        <div class="row">
          <div>
            <div class="label" style="color:var(--muted);font-size:0.78rem;margin-bottom:0.35rem;">选择工具</div>
            <select id="toolSelect"><option value="">— 请先拉取工具 —</option></select>
          </div>
        </div>
        <p class="hint">参数为 JSON 对象，将作为 <code>arguments</code> 传给 MCP <code>tools/call</code>。</p>
        <textarea id="argsJson" spellcheck="false">{}</textarea>
        <div class="toolbar" style="margin-top:0.5rem;">
          <button type="button" id="btnFillExample" title="对常见工具填入可运行示例">填入示例参数</button>
          <button type="button" class="primary" id="btnCall">执行调用</button>
        </div>
        <div class="label" style="color:var(--muted);font-size:0.78rem;margin:0.75rem 0 0.35rem;">结果</div>
        <pre id="callResult">（尚无）</pre>
        <p class="err-msg" id="callErr" hidden></p>
      </section>
    </main>
  </div>
  <script src="/mcp-admin/static/mcp-admin.js" defer></script>
</body>
</html>
