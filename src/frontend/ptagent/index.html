<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PTAgent — 总览</title>
  <link rel="stylesheet" href="/ui-static/shell.css" />
</head>
<body>
  <div class="layout ptagent-layout">
    <aside class="sidebar">
      <div class="brand">PTAgent</div>
      <a class="active" href="/ptagent-admin/">总览</a>
      <a href="/ptagent-admin/agents">Agents</a>
      <a href="/ptagent-admin/flow">工作流设计</a>
      <a href="/ptagent-admin/llm">LLM 设置</a>
      <div class="section">外部</div>
      <a href="/mcp-admin/" target="_blank" rel="noopener">MCP 控制台 ↗</a>
    </aside>
    <div class="layout-main-column">
    <button type="button" class="sidebar-toggle" id="btnSidebarToggle" title="收起/展开左侧导航">☰</button>
    <main class="main">
      <h1>总览</h1>
      <p class="lead">配置持久化在服务端 JSON；运行与干跑共用同一套编译与 invoke 管线。</p>
      <div class="stat-grid" id="stats">
        <div class="stat-card"><div class="v" id="stAgents">—</div><div class="l">已注册 Agent</div></div>
        <div class="stat-card"><div class="v" id="stTeams">—</div><div class="l">编排 Team</div></div>
        <div class="stat-card"><div class="v" id="stTools">—</div><div class="l">MCP 工具数</div></div>
      </div>
      <p class="muted" id="stPath"></p>
    </main>
    </div>
  </div>
  <script src="/ui-static/sidebar-toggle.js" defer></script>
  <script src="/ptagent-admin/static/index.js" defer></script>
</body>
</html>
