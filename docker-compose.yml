services:
  mysql:
    image: mysql:8.4
    container_name: ptagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_change_me
      MYSQL_DATABASE: ptagent_experiment
      MYSQL_USER: ptagent
      MYSQL_PASSWORD: ptagent_change_me
    ports:
      - "3307:3306"
    volumes:
      - ptagent_mysql_data:/var/lib/mysql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  ptagent_mysql_data:
