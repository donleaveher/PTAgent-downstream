<svg width="680" height="956" viewBox="0 0 680 956" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
svg { --t3: #6B6B66; }
text { font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #141413; }
.t { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
rect { stroke-width: 1; }
rect.c-gray, .c-gray rect { fill: #ECEAE1; stroke: #C4C2B8; }
.c-gray text { fill: #141413; }
rect.c-blue, .c-blue rect { fill: #E6F1FB; stroke: #9DC3EC; }
.c-blue text { fill: #08355F; }
rect.c-teal, .c-teal rect { fill: #E1F5EE; stroke: #7FD3B5; }
.c-teal text { fill: #06453A; }
@media (prefers-color-scheme: dark) {
  text { fill: #ECECE8; }
  .c-gray text, .c-blue text, .c-teal text { fill: #141413; }
}
</style>
<title>PTAgent 闭环 10 步整合（每步内部细节，从上往下）</title>
<desc>从输入、Casanovo、压扁、主干、查库归属、注释富集、混合检索、假说、在线查到报告，每行一步展开内部小流程，蓝处理、teal进图、灰不进图。</desc>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--t3)"/></marker></defs>

<rect x="30" y="16" width="12" height="12" rx="3" class="c-blue"/><text x="48" y="22" dominant-baseline="central" class="ts">处理</text>
<rect x="100" y="16" width="12" height="12" rx="3" class="c-teal"/><text x="118" y="22" dominant-baseline="central" class="ts">进图</text>
<rect x="170" y="16" width="12" height="12" rx="3" class="c-gray"/><text x="188" y="22" dominant-baseline="central" class="ts">不进图（文件/在线）</text>
<text x="470" y="22" dominant-baseline="central" class="ts">左列 = 步骤 ①→⑩</text>

<g class="c-gray"><rect x="30" y="75" width="84" height="50" rx="8"/><text x="72" y="92" text-anchor="middle" dominant-baseline="central" class="t">①</text><text x="72" y="110" text-anchor="middle" dominant-baseline="central" class="ts">输入</text></g>
