<path d="M284,100 L304,100" fill="none" stroke="var(--t3)" stroke-width="1.3" marker-end="url(#m)"/>
<g class="c-blue"><rect x="306" y="75" width="160" height="50" rx="8"/><text x="386" y="92" text-anchor="middle" dominant-baseline="central" class="t">ingest</text><text x="386" y="110" text-anchor="middle" dominant-baseline="central" class="ts">落盘 + 登记</text></g>
<path d="M466,100 L486,100" fill="none" stroke="var(--t3)" stroke-width="1.3" marker-end="url(#m)"/>
