<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t7 d7">
<title id="t7">定量数据在图谱中的位置（实例）</title>
<desc id="d7">顺序是 PSM 经 IDENTIFIES 连到 Peptide，Peptide 再经 QUANTIFIED_IN 连到各样本；丰度 intensity 存在 QUANTIFIED_IN 边的属性上，因为它取决于这条肽和这个样本的组合。</desc>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif}
.t{font-size:14px;font-weight:500;fill:#1c1c1a}
.ts{font-size:11px;fill:#5f5f59}
.c-gray&gt;rect{fill:#ecebe6;stroke:#a8a49a;stroke-width:1.5}
.c-teal&gt;rect{fill:#e2f3ef;stroke:#2fa58c;stroke-width:1.5}
.c-green&gt;rect{fill:#e7f3e8;stroke:#4a9d5b;stroke-width:1.5}
.c-coral&gt;rect{fill:#fae7e0;stroke:#c0573a;stroke-width:1.5}
.c-amber&gt;rect{fill:#fbf0dd;stroke:#c79023;stroke-width:1.5}
</style>
<defs>
<marker id="ar7" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa0a6"/></marker>
</defs>
<rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

<text class="t" x="40" y="26">定量数据放在哪里 + 和 Peptide 的顺序（一个实例）</text>
<text class="ts" x="40" y="46">顺序：Spectrum → PSM ─[:IDENTIFIES]→ Peptide ─[:QUANTIFIED_IN]→ Sample（Peptide 是枢纽）</text>

<g class="c-gray"><rect x="40" y="166" width="110" height="54" rx="10"/>
<text class="t" x="95" y="189" text-anchor="middle">PSM</text>
<text class="ts" x="95" y="207" text-anchor="middle">（鉴定侧）</text></g>
<line x1="150" y1="193" x2="253" y2="193" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar7)"/>
<text class="ts" x="201" y="185" text-anchor="middle">:IDENTIFIES</text>

<g class="c-teal"><rect x="255" y="158" width="180" height="70" rx="10"/>
<text class="t" x="345" y="190" text-anchor="middle">Peptide</text>
<text class="ts" x="345" y="210" text-anchor="middle">MEEVEES[+79.966]PEK</text></g>

<line x1="435" y1="178" x2="573" y2="84" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar7)"/>
<line x1="435" y1="193" x2="573" y2="195" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar7)"/>
<line x1="435" y1="208" x2="573" y2="306" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar7)"/>
<text class="ts" x="505" y="120" text-anchor="middle">{intensity: 1.0e7}</text>
<text class="ts" x="512" y="183" text-anchor="middle">:QUANTIFIED_IN {intensity: 4.2e7}</text>
<text class="ts" x="505" y="270" text-anchor="middle">{intensity: 1.1e7}</text>

<g class="c-green"><rect x="575" y="58" width="115" height="50" rx="10"/>
<text class="t" x="632" y="80" text-anchor="middle">Sample N1</text>
<text class="ts" x="632" y="97" text-anchor="middle">Normal</text></g>
<g class="c-coral"><rect x="575" y="170" width="115" height="50" rx="10"/>
<text class="t" x="632" y="192" text-anchor="middle">Sample T1</text>
<text class="ts" x="632" y="209" text-anchor="middle">Tumor</text></g>
<g class="c-green"><rect x="575" y="282" width="115" height="50" rx="10"/>
<text class="t" x="632" y="304" text-anchor="middle">Sample N2</text>
<text class="ts" x="632" y="321" text-anchor="middle">Normal</text></g>

<g class="c-amber"><rect x="40" y="352" width="650" height="50" rx="10"/>
<text class="ts" x="56" y="373">丰度 intensity 存在 QUANTIFIED_IN 边的属性上 —— 它取决于「这条肽 × 这个样本」这一对，</text>
<text class="ts" x="56" y="391">所以既不挂在 Peptide 节点、也不挂在 Sample 节点，而挂在两者之间的边。每个样本一条边。</text></g>
</svg>
